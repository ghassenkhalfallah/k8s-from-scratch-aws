---
# AWS EC2 dynamic inventory plugin.
# Requires: boto3, botocore, and the community.aws collection.
# Use alongside hosts.ini (generated by Terraform) or as a standalone source.
#
# Usage: ansible-inventory -i inventory/aws_ec2.yml --list

plugin: amazon.aws.aws_ec2

regions:
  - us-east-1

filters:
  tag:KubernetesCluster: k8s-cluster
  instance-state-name: running

keyed_groups:
  - key: tags.Role
    prefix: ""
    separator: ""

groups:
  masters: "'master' in tags.Role"
  workers: "'worker' in tags.Role"

hostnames:
  - tag:Name
  - private-ip-address

compose:
  ansible_host: private_ip_address
  ansible_user: "'ubuntu'"
  ansible_ssh_common_args: >-
    '-o StrictHostKeyChecking=no
     -o ProxyJump=ubuntu@{{ hostvars[groups["bastion"][0]]["public_ip_address"] }}'

# Set AWS credentials via environment variables:
#   export AWS_ACCESS_KEY_ID=...
#   export AWS_SECRET_ACCESS_KEY=...
#   export AWS_DEFAULT_REGION=us-east-1
